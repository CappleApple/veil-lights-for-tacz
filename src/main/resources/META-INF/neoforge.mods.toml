modLoader="javafml"
loaderVersion="[4,)"
license="CC BY-NC-SA 4.0 with Modpack/Server Exception"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="veiltaczlights.png"
description='''${mod_description}'''
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
type="required"
versionRange="[${tacz_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="veil"
type="required"
versionRange="[${veil_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="${library_mod_id}"
type="required"
versionRange="[${library_mod_version},)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="veiltaczlights.mixins.json"
